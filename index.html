<!DOCTYPE html>
<html>
<head>
    <title>My Animation</title>

    <style>
        body {
            font-family: Arial;
            text-align: center;
            background-color: #f2f2f2;
        }

        h1 {
            margin-top: 40px;
            color: #333;
        }

        .container {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 40px;
        }

        .box {
            width: 110px;
            height: 110px;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            border-radius: 10px;
            font-weight: bold;
            box-shadow: 0 4px 8px gray;
        }

       
        .fade {
            background-color: #3498db;
        }

        .fade:hover {
            opacity: 0.3;
            transition: 0.5s;
        }

        .shake {
            background-color: #e74c3c;
        }

        .shake:hover {
            animation: shake 0.4s;
        }

        @keyframes shake {
            0% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            50% { transform: translateX(10px); }
            75% { transform: translateX(-10px); }
            100% { transform: translateX(0); }
        }

      
        .jump {
            background-color: #2ecc71;
        }

        .jump:hover {
            animation: jump 0.6s;
        }

        @keyframes jump {
            50% {
                transform: translateY(-30px);
            }
        }
    </style>
</head>

<body>

    <h1>JOHN PATRICK ABELIDA</h1>

    <div class="container">

        <div class="box fade">
            FADE
        </div>

        <div class="box shake">
            SHAKE
        </div>

        <div class="box jump">
            JUMP
        </div>

    </div>

</body>
</html>
